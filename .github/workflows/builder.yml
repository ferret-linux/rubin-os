name: Build RubinOS

on:
  pull_request:
  push:
    paths-ignore:
      - '**/README.md'
  schedule:
    - cron: '05 10 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/.build.yml
    permissions:
      contents: read
      packages: write

  rechunk:
    needs: [build]
    uses: ./.github/workflows/.rechunk.yml
    permissions:
      contents: read

  sbom-grype:
    needs: [rechunk]
    uses: ./.github/workflows/.sbom-grype.yml
    permissions:
      contents: read

  push:
    needs: [sbom-grype]
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/.push.yml
    permissions:
      contents: read
      packages: write
    secrets:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}

  verify:
    needs: [push]
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/.verify.yml
    permissions:
      contents: read
      packages: read

  rollback:
    needs: [verify]
    if: always() && needs.verify.result == 'failure'
    uses: ./.github/workflows/.rollback.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit