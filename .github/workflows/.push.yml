name: push (internal)

on:
  workflow_call:
    secrets:
      SIGNING_SECRET:
        required: true

jobs:
  push:
    name: Push ${{ matrix.image_name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: rubin-os
          - image_name: rubin-os-nvidia

    steps:
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Save Old Digest
        id: old-digest
        run: |
          OLD_DIGEST=$(podman manifest inspect ghcr.io/ferret-linux/${{ matrix.image_name }}:latest 2>/dev/null \
            | jq -r '.manifests[0].digest // empty' || true)
          echo "old_digest=${OLD_DIGEST}" >> $GITHUB_OUTPUT
          echo "Old digest: ${OLD_DIGEST:-none}"

      - name: Download Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: image-${{ matrix.image_name }}
          path: /tmp

      - name: Verify Checksum
        run: sha256sum -c /tmp/${{ matrix.image_name }}.tar.sha256

      - name: Load Image
        run: podman image load -i /tmp/${{ matrix.image_name }}.tar

      - name: Push
        run: |
          for i in 1 2 3; do
            podman push \
              --compression-format=zstd \
              ghcr.io/ferret-linux/${{ matrix.image_name }}:latest && break
            echo "Attempt $i/3 failed, retrying in 15s..."
            sleep 15
          done

      - name: Save New Version ID
        id: new-version
        run: |
          NEW_VERSION_ID=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /orgs/ferret-linux/packages/container/${{ matrix.image_name }}/versions \
            | jq -r 'sort_by(.created_at) | last | .id')
          echo "new_version_id=${NEW_VERSION_ID}" >> $GITHUB_OUTPUT
          echo "New version ID: ${NEW_VERSION_ID}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Rollback Info
        run: |
          mkdir -p /tmp/rollback
          echo "${{ steps.old-digest.outputs.old_digest }}" > /tmp/rollback/${{ matrix.image_name }}-old-digest
          echo "${{ steps.new-version.outputs.new_version_id }}" > /tmp/rollback/${{ matrix.image_name }}-new-version-id

      - name: Upload Rollback Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rollback-${{ matrix.image_name }}
          path: /tmp/rollback/
          retention-days: 1

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.3'

      - name: Sign
        run: |
          for i in 1 2 3; do
            cosign sign -y --key env://COSIGN_PRIVATE_KEY \
              ghcr.io/ferret-linux/${{ matrix.image_name }}:latest && break
            echo "Attempt $i/3 failed, retrying in 15s..."
            sleep 15
          done
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}